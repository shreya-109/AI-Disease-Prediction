
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Welcome Back</h1>
        <p>Login to AI Disease Prediction System</p>
    </div>

    <div class="card">

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
                style="width:100%; padding:12px; margin:8px 0 18px;"
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
                style="width:100%; padding:12px; margin:8px 0 18px;"
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p style="text-align:center; margin-top:20px;">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>

    </div>

</div>

</body>

</html>
