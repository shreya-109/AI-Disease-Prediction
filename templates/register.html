
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Create Account</h1>

        <p>Register to use the AI Disease Prediction System</p>

    </div>


    <div class="card">

        <form method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
                style="width:100%; padding:12px; margin:8px 0 18px;"
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
                style="width:100%; padding:12px; margin:8px 0 18px;"
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
                minlength="6"
                style="width:100%; padding:12px; margin:8px 0 18px;"
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p style="text-align:center; margin-top:20px;">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

</body>

</html>
