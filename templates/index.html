<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>AI Disease Prediction</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

<style>
    .back-dashboard-btn {
        display: inline-block;
        margin-bottom: 25px;
        padding: 10px 18px;
        background: #ffffff;
        color: #2563eb;
        border: 1px solid #2563eb;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
    }

    .back-dashboard-btn:hover {
        background: #2563eb;
        color: white;
    }

    .symptom-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin: 20px 0;
    }

    .symptom-item {
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        cursor: pointer;
        background: #fff;
    }

    .symptom-item:hover {
        border-color: #2563eb;
    }

    .predict-btn {
        padding: 13px 25px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .predict-btn:hover {
        background: #1d4ed8;
    }

    #result {
        margin-top: 25px;
        padding: 20px;
        border-radius: 10px;
        background: #f8fafc;
    }

    @media (max-width: 600px) {
        .symptom-grid {
            grid-template-columns: 1fr;
        }
    }
</style>


</head>

<body>

<div class="container">

<div class="header">
    <h1>AI Disease Prediction</h1>
    <p>Select your symptoms and get an ML-based prediction</p>
</div>

<!-- ONLY RETURN TO DASHBOARD BUTTON -->
<a href="{{ url_for('dashboard') }}" class="back-dashboard-btn">
    ← Back to Dashboard
</a>

<div class="card">

    <h2>Select Symptoms</h2>

    <div class="symptom-grid">

        <label class="symptom-item">
            <input type="checkbox" value="fever">
            Fever
        </label>

        <label class="symptom-item">
            <input type="checkbox" value="cough">
            Cough
        </label>

        <label class="symptom-item">
            <input type="checkbox" value="fatigue">
            Fatigue
        </label>

        <label class="symptom-item">
            <input type="checkbox" value="headache">
            Headache
        </label>

        <label class="symptom-item">
            <input type="checkbox" value="sore_throat">
            Sore Throat
        </label>

        <label class="symptom-item">
            <input type="checkbox" value="nausea">
            Nausea
        </label>

        <label class="symptom-item">
            <input type="checkbox" value="vomiting">
            Vomiting
        </label>

        <label class="symptom-item">
            <input type="checkbox" value="joint_pain">
            Joint Pain
        </label>

        <label class="symptom-item">
            <input type="checkbox" value="skin_rash">
            Skin Rash
        </label>

        <label class="symptom-item">
            <input type="checkbox" value="stomach_pain">
            Stomach Pain
        </label>

    </div>

    <button class="predict-btn" onclick="predictDisease()">
        Predict Disease
    </button>

    <div id="result"></div>

</div>

</div>

<script>

async function predictDisease() {

    const checkboxes =
        document.querySelectorAll(
            'input[type="checkbox"]:checked'
        );

    const symptoms =
        Array.from(checkboxes)
        .map(checkbox => checkbox.value);

    if (symptoms.length === 0) {
        document.getElementById("result").innerHTML =
            "<strong>Please select at least one symptom.</strong>";
        return;
    }

    try {

        const response = await fetch("/predict", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                symptoms: symptoms
            })
        });

        const result = await response.json();

        if (!response.ok) {
            document.getElementById("result").innerHTML =
                "<strong>" +
                (result.error || "Something went wrong.") +
                "</strong>";
            return;
        }

        document.getElementById("result").innerHTML =
            "<h2>Prediction Result</h2>" +
            "<p><strong>Predicted Disease:</strong> " +
            result.disease +
            "</p>" +
            "<p><strong>Confidence:</strong> " +
            result.confidence +
            "%</p>";

    } catch (error) {

        document.getElementById("result").innerHTML =
            "<strong>Unable to connect to the server.</strong>";

        console.error(error);
    }
}

</script>

</body>
</html>
